<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CareerAI – AI-Powered Career Guidance">
    <title>CareerAI – AI-Powered Career Guidance</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#0a0e27',
                        purple: '#1a1a3e',
                        electric: '#3b82f6',
                        emerald: '#10b981',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-navy text-white font-sans overflow-x-hidden">
    <!-- Main App Container -->
    <div id="app" class="min-h-screen"></div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- Chatbot Widget -->
    <div id="chatbot-widget" class="fixed bottom-6 right-6 z-40 hidden">
        <button id="chatbot-toggle-btn" class="btn-primary rounded-full w-14 h-14 flex items-center justify-center shadow-lg animate-pulse-glow" aria-label="Open Chatbot">
            <span class="text-2xl">🤖</span>
        </button>
        <div id="chat-panel" class="hidden absolute bottom-16 right-0 glass-card-strong w-80 sm:w-96 h-[500px] flex-col rounded-2xl overflow-hidden shadow-2xl origin-bottom-right transition-all duration-300">
            <!-- Chat Header -->
            <div class="px-4 py-3 bg-white/10 flex justify-between items-center border-b border-white/10">
                <div class="flex items-center gap-2">
                    <span class="text-xl">🤖</span>
                    <h3 class="font-heading font-semibold">CareerAI Assistant</h3>
                </div>
                <button id="chatbot-close-btn" class="text-gray-400 hover:text-white transition-colors" aria-label="Close Chat">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <!-- Chat Messages -->
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3 custom-scrollbar">
                <div class="chat-bubble-ai self-start bg-white/10 p-3 rounded-2xl rounded-tl-sm text-sm max-w-[85%]">
                    Hello! I'm your CareerAI assistant. How can I help you today?
                </div>
            </div>
            <!-- Quick Suggestions -->
            <div id="chat-suggestions" class="px-4 py-2 flex gap-2 overflow-x-auto custom-scrollbar whitespace-nowrap">
                <button class="skill-tag text-xs bg-white/5 hover:bg-white/10 px-3 py-1 rounded-full border border-white/10 transition-colors" onclick="window.chatbot.sendQuickMessage('What career suits me?')">What career suits me?</button>
                <button class="skill-tag text-xs bg-white/5 hover:bg-white/10 px-3 py-1 rounded-full border border-white/10 transition-colors" onclick="window.chatbot.sendQuickMessage('Resume tips')">Resume tips</button>
                <button class="skill-tag text-xs bg-white/5 hover:bg-white/10 px-3 py-1 rounded-full border border-white/10 transition-colors" onclick="window.chatbot.sendQuickMessage('Interview preparation')">Interview prep</button>
            </div>
            <!-- Chat Input -->
            <div class="p-3 border-t border-white/10 bg-black/20">
                <form id="chat-form" class="flex gap-2">
                    <input type="text" id="chat-input" class="flex-1 bg-white/5 border border-white/10 rounded-full px-4 py-2 text-sm focus:outline-none focus:border-electric transition-colors" placeholder="Type a message..." required>
                    <button type="submit" class="bg-electric text-white rounded-full w-10 h-10 flex items-center justify-center hover:bg-blue-600 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                        </svg>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/utils.js"></script>
    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/profile.js"></script>
    <script type="module" src="js/resume.js"></script>
    <script type="module" src="js/career.js"></script>
    <script type="module" src="js/roadmap.js"></script>
    <script type="module" src="js/dashboard.js"></script>
    <script type="module" src="js/chatbot.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
