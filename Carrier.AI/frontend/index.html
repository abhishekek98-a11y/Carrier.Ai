<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CareerAI – AI-Powered Career Guidance Platform">
    <title>CareerAI – AI-Powered Career Guidance</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#090d16',
                        purple: '#1e1b4b',
                        electric: '#3b82f6',
                        emerald: '#10b981',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#090d16] text-white font-sans overflow-x-hidden antialiased">
    <!-- Main App Container -->
    <div id="app" class="min-h-screen"></div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- Chatbot Widget -->
    <div id="chatbot-widget" class="fixed bottom-6 right-6 z-40 hidden">
        <button id="chatbot-toggle-btn" class="btn-primary rounded-full w-14 h-14 flex items-center justify-center shadow-xl shadow-blue-500/30 animate-pulse-glow hover:scale-105 transition-transform" aria-label="Open Chatbot">
            <span class="text-2xl">🤖</span>
        </button>
        <div id="chat-panel" class="hidden absolute bottom-16 right-0 glass-card-strong w-80 sm:w-96 h-[520px] flex-col rounded-2xl overflow-hidden shadow-2xl origin-bottom-right transition-all duration-300 border border-white/15">
            <!-- Chat Header -->
            <div class="px-4 py-3.5 bg-white/10 flex justify-between items-center border-b border-white/10">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-blue-500/20 border border-blue-500/30 text-blue-400 flex items-center justify-center text-lg">🤖</div>
                    <div>
                        <h3 class="font-heading font-bold text-sm text-white leading-none">CareerAI Assistant</h3>
                        <span class="text-[10px] text-emerald-400 font-semibold flex items-center gap-1 mt-0.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Online
                        </span>
                    </div>
                </div>
                <button id="chatbot-close-btn" class="text-gray-400 hover:text-white p-1 transition-colors" aria-label="Close Chat">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <!-- Chat Messages -->
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3 custom-scrollbar">
                <div class="chat-bubble-ai self-start bg-white/10 p-3 rounded-2xl rounded-tl-sm text-xs text-gray-200 leading-relaxed max-w-[85%] border border-white/5">
                    Hello! I'm your CareerAI assistant. How can I help with your career path or resume today?
                </div>
            </div>
            <!-- Quick Suggestions -->
            <div id="chat-suggestions" class="px-3 py-2 flex gap-1.5 overflow-x-auto custom-scrollbar whitespace-nowrap bg-black/20 border-t border-white/5">
                <button class="skill-tag text-[11px] bg-white/5 hover:bg-white/10 px-3 py-1 rounded-full border border-white/10 transition-colors" onclick="window.chatbot.sendQuickMessage('What career suits me?')">What career suits me?</button>
                <button class="skill-tag text-[11px] bg-white/5 hover:bg-white/10 px-3 py-1 rounded-full border border-white/10 transition-colors" onclick="window.chatbot.sendQuickMessage('Resume tips')">Resume tips</button>
                <button class="skill-tag text-[11px] bg-white/5 hover:bg-white/10 px-3 py-1 rounded-full border border-white/10 transition-colors" onclick="window.chatbot.sendQuickMessage('Interview preparation')">Interview prep</button>
            </div>
            <!-- Chat Input -->
            <div class="p-3 border-t border-white/10 bg-slate-950/80">
                <form id="chat-form" class="flex gap-2">
                    <input type="text" id="chat-input" class="flex-1 px-4 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-blue-500 rounded-full" placeholder="Type your message..." required>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white rounded-full w-9 h-9 flex items-center justify-center transition-colors shadow-md shadow-blue-500/20">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                        </svg>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/utils.js"></script>
    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/profile.js"></script>
    <script type="module" src="js/resume.js"></script>
    <script type="module" src="js/career.js"></script>
    <script type="module" src="js/roadmap.js"></script>
    <script type="module" src="js/dashboard.js"></script>
    <script type="module" src="js/chatbot.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
